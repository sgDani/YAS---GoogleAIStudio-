
<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yanelle Schwarz | Design & Renovierung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              // Nuevo fondo: "Piedra Caliza" / "Papel Arroz" - Menos amarillo, más neutro y elegante
              cream: '#EFEDE6', 
              // Nuevo negro: "Carbón Cálido" - Menos duro que el negro puro
              softBlack: '#1A1918',
              // Nuevo acento: "Taupe / Piedra" - Más presencia y legibilidad que el gris anterior
              warmGray: '#9C978E',
              white: '#ffffff',
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #EFEDE6; /* Actualizado al nuevo color cream */
        color: #1A1918; /* Actualizado al nuevo softBlack */
      }
      /* Hide scrollbar for clean look in some browsers but allow scrolling */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body class="bg-cream text-softBlack font-sans selection:bg-warmGray selection:text-white">
    <div id="root"></div>
  </body>
</html>
